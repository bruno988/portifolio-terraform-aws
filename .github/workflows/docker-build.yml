name: Docker Build e Push

on:
  push:
    branches: [ "main" ] # Executa sempre que você envia para a branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # O GitHub vai ligar um computador Linux para fazer o serviço
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v4
        with:
          context: . # Ele vai olhar a pasta principal onde está o Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/meu-site-devops:latest